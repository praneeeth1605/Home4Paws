<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin Registration - Home4paws</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <img src="images/logo.jpeg"
     class="logo"
     alt="Home4paws Logo">
    <nav>
        <a href="index.html">Home</a>
        <a href="admin-login.html">Admin Login</a>
    </nav>
</header>

<div class="auth-box">
    <h1>Admin Registration</h1>
    <p>Register as an administrator</p>

    <form id="adminRegisterForm">
        <label>Name</label>
        <input
            type="text"
            id="adminName"
            placeholder="Enter your full name"
            required
        >

        <label>Username</label>
        <input
            type="text"
            id="adminUsername"
            placeholder="Create a username"
            required
        >

        <label>Email</label>
        <input
            type="email"
            id="adminEmail"
            placeholder="Enter your email"
            required
        >

        <label>Common Registration Password</label>
        <input
            type="password"
            id="commonAdminPassword"
            placeholder="Enter common password"
            required
        >

        <small>
            Enter the common password provided to administrators.
        </small>

        <label>Your Login Password</label>
        <input
            type="password"
            id="adminPassword"
            placeholder="Create your own password"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            id="adminConfirmPassword"
            placeholder="Confirm your password"
            required
        >

        <button type="submit" class="btn">
            Register
        </button>
    </form>

    <p id="adminRegisterMessage" style="color:#d32f2f;font-weight:bold;"></p>

    <p>
        Already registered?
        <a href="admin-login.html">Login here</a>
    </p>
</div>

<script src="script.js"></script>
</body>
</html>
